name: Test with Maven
on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  maven_test:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up JDK 25
        uses: actions/setup-java@v6.3.0
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Build and test with Maven
        run: mvn -B package
